{% set version = "0.19.0" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-tinytable
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/tinytable_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/tinytable/tinytable_{{ version }}.tar.gz
  sha256: 070241746286adf4ed4cd59a1da702dbaaea1f43a8e9d38d108428bce8e410d8

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
  run:
    - r-base

test:
  commands:
    - $R -e "library('tinytable')"           # [not win]
    - "\"%R%\" -e \"library('tinytable')\""  # [win]

about:
  home: https://vincentarelbundock.github.io/tinytable/
  license: GPL-3.0-or-later
  summary: Create highly customized tables with this simple and dependency-free package. Data frames can be converted to 'HTML', 'LaTeX', 'Markdown', 'Word', 'PNG', 'PDF', or 'Typst' tables. The user interface is minimalist and easy to learn. The syntax is concise. 'HTML' tables can be customized using the flexible 
    'Bootstrap' framework, and 'LaTeX' code with the 'tabularray' package.
  license_family: GPL3
  license_file:
    - '{{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3'

extra:
  recipe-maintainers:
    - conda-forge/r
